# Baseline Neural ODE experiment. Sweeps and command-line overrides change one key at a time,
# e.g.  python -m neural_ode.run configs/base.yaml data.n_train=512 seed=1
# Keys left out keep the defaults in src/neural_ode/config.py.

name: neural_ode
seed: 0                    # model init and batch order

data:
  system: harmonic_oscillator
  t_end: 30.0              # s, training window
  dt: 0.5                  # s per frame
  n_train: 256
  n_val: 128
  n_test: 128
  seed: 0                  # keep fixed across runs

model:
  latent_dim: 2
  decoder: mlp             # mlp | linear
  drift_hidden_dim: 64
  steps_per_frame: 1
  gradient: 'adjoint'


train:                     # any TrainConfig field can go here
  n_iters: 4000

eval:
  forecast_t_end: 60.0     # s; <= data.t_end switches forecasting off
  n_forecast: 256

plots:                     # figures only; not part of the W&B config
  color_param: omega
  grid:                    # parameter grid for the latent-flow plot; remove to skip it
    omega: [0.35, 0.85, 6] # linspace(start, stop, num)
    phase: 12              # an angle: 12 points round the circle
  snapshot_times: [0.0, 2.5, 5.0, 10.0]

out_dir: models            # models/<name>/<run_id>: model, config, metrics
fig_dir: reports/figures   # reports/figures/<name>/<run_id>: figures
wandb_project: Master's Thesis   # null = local files only
tags: []
